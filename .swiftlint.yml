included:
  - Sources
  - Tests
  # Build-time generators for the WebAssembly package's assets. Not products,
  # but Swift source that CI should hold to the same rules — without this the
  # argument-less invocation CI uses skips them entirely.
  - Tools
  # The manifest is Swift source too, and the pre-commit hook lints it
  # either way — it passes staged paths explicitly, so `included:` does not
  # apply there. Listing it keeps CI and the hook looking at the same set;
  # without it a manifest violation only ever surfaces on the machine that
  # happens to have the hook installed.
  - Package.swift

excluded:
  - "**/.build"
  - "**/.swiftpm"
  - "Examples/Apple"
  # Untracked PDF spike harnesses (.git/info/exclude) — measurement probes
  # gated behind SM_PDF_SPIKE, not shipped code. Linting them made a personal
  # scratch file able to fail `preflight.sh --apple` for the whole checkout.
  - "Tests/SheetMusicTests/PDFClefInspectSpikeTests.swift"
  - "Tests/SheetMusicTests/PDFCorpusGroundTruthSpikeTests.swift"
  - "Tests/SheetMusicTests/PDFGibbsGroundTruthSpikeTests.swift"
  - "Tests/SheetMusicTests/PDFSimpleFontEncodingProbeSpikeTests.swift"
  # Machine-generated SMuFL codepoint tables — do not lint
  - "Sources/SheetMusicLayout/Engraving/SMuFLCodepoints+Noteheads.swift"
  - "Sources/SheetMusicLayout/Engraving/SMuFLCodepoints+Accidentals.swift"
  - "Sources/SheetMusicLayout/Engraving/SMuFLCodepoints+Lines.swift"
  - "Sources/SheetMusicLayout/Engraving/SMuFLCodepoints+ByName.swift"

line_length:
  warning: 120

closure_body_length:
  warning: 40

function_body_length:
  warning: 60

file_length:
  warning: 400

type_body_length:
  warning: 400

type_name:
  min_length: 1

identifier_name:
  min_length: 1

large_tuple:
  warning: 4

# `file_length` is the only rule whose violation cannot be scoped to a
# single declaration with `:next`, so blanket-disabling it at the top of
# an intentionally long file is the only practical option. Every other
# rule must use `:next` / `:previous` / `:this` (see the
# `scoped_swiftlint_disable` custom rule below).
blanket_disable_command:
  severity: error
  allowed_rules:
    - file_length

custom_rules:
  # Forbid `extension Foo where ...` (constrained extension). Place the
  # where-clause on each member instead. Extension-level where is allowed
  # only when paired with protocol conformance (`extension Foo: Bar where`).
  no_constrained_extension:
    name: "Constrained Extension"
    regex: '(?m)^[ \t]*extension[ \t]+\w+(?:<[^>]*>)?[ \t\r\n]+where\b'
    message: "Move the where-clause onto individual members. Extension-level where is allowed only with protocol conformance."
    severity: warning
  # Force every swiftlint disable directive to be line-scoped with
  # :next / :previous / :this. The single exception is
  # `// swiftlint:disable file_length` alone on a line (file_length has
  # no meaningful line-scoped form). The matching enable directive is
  # banned by `no_swiftlint_enable` below.
  scoped_swiftlint_disable:
    name: "Scoped SwiftLint Disable"
    regex: '//\s*swiftlint:disable\s+(?!file_length\s*$)\S'
    match_kinds:
      - comment
    message: "Use // swiftlint:disable:next (or :previous, :this) instead of an unscoped disable. The only blanket form allowed is `// swiftlint:disable file_length`."
    severity: error
  # Disable/enable pair blocks are banned project-wide; `:next` /
  # `:previous` / `:this` are expressive enough for any real case. The
  # only allowed unscoped disable is `// swiftlint:disable file_length`,
  # which by definition has no closing enable.
  no_swiftlint_enable:
    name: "No SwiftLint Enable"
    regex: '//\s*swiftlint:enable\b'
    match_kinds:
      - comment
    message: "Disable/enable pair blocks are not allowed; use :next / :previous / :this to scope individual lines."
    severity: error
  # The portable targets reach Foundation through `SheetMusicFoundation`,
  # which resolves to `FoundationEssentials` on WASI / Linux / Android and
  # to `Foundation` on Apple. Importing the umbrella directly links ICU
  # into the WebAssembly binary: measured at ~13 MB brotli against ~3.2 MB,
  # from as little as one file. Nothing in the compiler objects — it builds
  # on every platform, it just quadruples the download — so this rule is
  # the fast half of the gate and `Scripts/wasm-size.sh` is the slow half
  # that also catches regressions coming in through a dependency.
  #
  # Deliberately blind to `#if`: both regressions during the migration came
  # from imports that were nested in a conditional, and one of them was
  # under a branch that is live on WASI. A genuinely platform-scoped import
  # is rare enough to carry a `// swiftlint:disable:next` and a reason.
  #
  # `Foundation\b` does not match `FoundationEssentials` or
  # `SheetMusicFoundation`, so only the umbrella and its two satellite
  # modules trip this.
  no_foundation_umbrella:
    name: "Foundation Umbrella In Portable Target"
    # One regex rather than an alternation list so the trailing slash can
    # do the disambiguating: `SheetMusicLayout/` is in scope while
    # `SheetMusicLayoutApple/` is not, `SheetMusicAudioCore/` is while
    # `SheetMusicAudio/` is not, and `SheetMusicFoundation/` — the shim,
    # which has to import the umbrella — is excluded by not being listed.
    # `WasmSizeProbe` is here because an umbrella import there would fail
    # the size gate while the libraries were in fact still clean.
    included: 'Sources/(?:SheetMusic(?:Core|XMLTools|Zip|MIDI|MSCX|MusicXML|Layout|AudioCore|EditWire|BridgeCore|WasmBridge)?|WasmSizeProbe)/'
    regex: '(?m)^[ \t]*(?:@[A-Za-z_]+[ \t]+)*import[ \t]+(?:(?:class|struct|enum|protocol|typealias|func|var|let)[ \t]+)?Foundation(?:XML|Networking)?\b'
    message: "Portable targets must import SheetMusicFoundation, not the Foundation umbrella — it links ICU into the WebAssembly binary (~13 MB brotli vs ~3.2 MB). See Sources/SheetMusicFoundation."
    severity: error
  no_prose_error_codes:
    name: "Prose In Error Code"
    included: '(?:Sources|Tests|Tools|Package\.swift)'
    regex: 'code:\s*"(?:[^"]*\s[^"]*|[^"]*\\\()'
    message: "Error/diagnostic codes are dotted identifiers: no spaces, no interpolation. Put prose in `message:`."
    severity: error
