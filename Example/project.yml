name: MuseScoreParserExample

options:
  developmentLanguage: en
  deploymentTarget:
    iOS: 16.0

packages:
  MuseScoreParser:
    path: ../

targets:
  MuseScoreParserExample:
    type: application
    platform: iOS
    settings:
      INFOPLIST_FILE: Info.plist
      TARGETED_DEVICE_FAMILY: 1
      PRODUCT_BUNDLE_IDENTIFIER: com.dev.MuseScoreParserExample
      MARKETING_VERSION: 1.0
      CURRENT_PROJECT_VERSION: 1
    sources:
      - MuseScoreParserExample
    dependencies:
      - package: MuseScoreParser
