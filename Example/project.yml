name: SheetMusicExample

options:
  developmentLanguage: en
  deploymentTarget:
    iOS: 16.0
    macOS: 15.0

packages:
  swift-sheet-music:
    path: ../

targets:
  SheetMusicExample:
    type: application
    platform: iOS
    settings:
      INFOPLIST_FILE: Info.plist
      TARGETED_DEVICE_FAMILY: 1
      PRODUCT_BUNDLE_IDENTIFIER: com.dev.SheetMusicExample
      MARKETING_VERSION: 1.0
      CURRENT_PROJECT_VERSION: 1
    sources:
      - path: SheetMusicExample
        excludes:
          - macOS
          - Sounds
          - Resources/Fonts
      # Folder reference (blue folder) — preserves the `Sounds/`
      # subdirectory inside the .app bundle so
      # `Bundle.url(forResource:..., subdirectory: "Sounds")`
      # resolves. `optional: true` lets the project generate when
      # the user hasn't downloaded the SoundFont set yet.
      - path: SheetMusicExample/Sounds
        type: folder
        optional: true
      # Edwin (OFL) — MuseScore's default text font. Bundled into
      # the example app (not into the SheetMusic SwiftPM package)
      # so library consumers can supply their own face if they
      # prefer. `SheetMusicFonts.register` is called at app launch.
      - path: SheetMusicExample/Resources/Fonts
        type: folder
    dependencies:
      - package: swift-sheet-music
        product: SheetMusic
      - package: swift-sheet-music
        product: SheetMusicUI
      - package: swift-sheet-music
        product: SheetMusicAudio
      - package: swift-sheet-music
        product: SheetMusicPDF

  SheetMusicExampleMac:
    type: application
    platform: macOS
    settings:
      INFOPLIST_FILE: Info.plist
      PRODUCT_BUNDLE_IDENTIFIER: com.dev.SheetMusicExample.Mac
      MARKETING_VERSION: 1.0
      CURRENT_PROJECT_VERSION: 1
      CODE_SIGN_STYLE: Manual
      CODE_SIGN_IDENTITY: "-"
    sources:
      - path: SheetMusicExample
        excludes:
          - Sounds
          - Resources/Fonts
      - path: SheetMusicExample/Sounds
        type: folder
        optional: true
      - path: SheetMusicExample/Resources/Fonts
        type: folder
    dependencies:
      - package: swift-sheet-music
        product: SheetMusic
      - package: swift-sheet-music
        product: SheetMusicUI
      - package: swift-sheet-music
        product: SheetMusicAudio
      - package: swift-sheet-music
        product: SheetMusicPDF
