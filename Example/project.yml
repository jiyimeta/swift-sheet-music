name: SheetMusicExample

options:
  developmentLanguage: en
  deploymentTarget:
    iOS: 16.0
    macOS: 15.0

packages:
  swift-sheet-music:
    path: ../

targets:
  SheetMusicExample:
    type: application
    platform: iOS
    settings:
      INFOPLIST_FILE: Info.plist
      TARGETED_DEVICE_FAMILY: 1
      PRODUCT_BUNDLE_IDENTIFIER: com.dev.SheetMusicExample
      MARKETING_VERSION: 1.0
      CURRENT_PROJECT_VERSION: 1
    sources:
      - path: SheetMusicExample
        excludes:
          - macOS
    dependencies:
      - package: swift-sheet-music
        product: SheetMusic
      - package: swift-sheet-music
        product: SheetMusicUI

  SheetMusicExampleMac:
    type: application
    platform: macOS
    settings:
      INFOPLIST_FILE: Info.plist
      PRODUCT_BUNDLE_IDENTIFIER: com.dev.SheetMusicExample.Mac
      MARKETING_VERSION: 1.0
      CURRENT_PROJECT_VERSION: 1
      CODE_SIGN_STYLE: Manual
      CODE_SIGN_IDENTITY: "-"
    sources:
      - path: SheetMusicExample
    dependencies:
      - package: swift-sheet-music
        product: SheetMusic
      - package: swift-sheet-music
        product: SheetMusicUI
