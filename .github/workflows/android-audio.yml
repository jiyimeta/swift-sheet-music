name: Android audio module

# Manual-only. Automatic push / pull_request triggers were removed because
# this job runs on a macos-14 runner (10x billing multiplier) and reproduces
# the local-dev cross-compile pipeline verbatim — at ~40-75 min wall-clock it
# exhausted the private-repo free-tier Actions minutes. The same verification
# now runs locally before merging to main via Scripts/preflight.sh; see
# CLAUDE.md "Pre-merge verification (CI is manual-only)". Trigger this from the
# Actions tab (or `gh workflow run "Android audio module"`) only when you want
# a clean-room CI reproduction.
on:
  workflow_dispatch:

# Building the Android audio module reproduces the full local-dev
# cross-compile pipeline, so this runs on macOS (Scripts/android-build-libs.sh
# hardcodes darwin NDK paths). The chain mirrors android-publish.yml:
#
#   1. Host Swift 6.3.2 (org.swift toolchain) + Android Swift SDK + NDK.
#   2. Scripts/android-build-libs.sh cross-compiles SheetMusicAndroidJNI for
#      each ABI and stages the swift-java JExtract Java bindings into
#      SheetMusicAndroid/src/main/java-generated. This also resolves the
#      SwiftPM deps (swift-wirelet via SSH, swift-java) into .build/checkouts.
#   3. swift-java's SwiftKitCore is published to mavenLocal (not on Central).
#   4. The wirelet Gradle plugin is fetched from GitHub Packages and runs
#      `swift run` against .build/checkouts/swift-wirelet to emit Kotlin codecs.
#
# A single classic PAT (repo + read:packages) as WIRELET_PAT covers both
# private swift-wirelet sources: the git insteadOf rewrite clones the SSH-form
# SwiftPM dependency over HTTPS, and GITHUB_TOKEN authenticates the Gradle
# plugin download.
env:
  WIRELET_PAT: ${{ secrets.WIRELET_PAT }}
  TOOLCHAINS: org.swift.632202605101a

jobs:
  build-and-test:
    runs-on: macos-14
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4

      - name: Authenticate git for the private swift-wirelet dependency
        run: |
          git config --global \
            url."https://x-access-token:${WIRELET_PAT}@github.com/".insteadOf \
            "git@github.com:"

      - name: Install Swift 6.3.2 toolchain
        run: |
          curl -fLO https://download.swift.org/swift-6.3.2-release/xcode/swift-6.3.2-RELEASE/swift-6.3.2-RELEASE-osx.pkg
          sudo installer -pkg swift-6.3.2-RELEASE-osx.pkg -target /
          swift --version

      - uses: android-actions/setup-android@v3

      - name: Install required NDK
        run: sdkmanager "ndk;27.2.12479018"

      - name: Install Swift Android SDK
        env:
          ANDROID_SDK_CHECKSUM: 939e933549d12d28f2e0bf71019d734d309859e9773c572657ce565a81f85d68
        run: |
          swift sdk install \
              https://download.swift.org/swift-6.3.2-release/android-sdk/swift-6.3.2-RELEASE/swift-6.3.2-RELEASE_android.artifactbundle.tar.gz \
              --checksum "$ANDROID_SDK_CHECKSUM"
          NDK_DIR="$ANDROID_HOME/ndk/27.2.12479018"
          ANDROID_NDK_HOME="$NDK_DIR" \
              ~/Library/org.swift.swiftpm/swift-sdks/swift-6.3.2-RELEASE_android.artifactbundle/swift-android/scripts/setup-android-sdk.sh

      - name: Cross-compile JNI natives + stage swift-java bindings
        run: Scripts/android-build-libs.sh

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v3

      - name: Publish swift-java SwiftKitCore to Maven local
        run: >-
          .build/checkouts/swift-java/gradlew
          -p .build/checkouts/swift-java
          :SwiftKitCore:publishToMavenLocal

      - name: Run Kotlin unit tests
        working-directory: Android
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.WIRELET_PAT }}
        run: ./gradlew :SheetMusicAudioAndroid:testDebugUnitTest --info

      - name: Assemble release AAR
        working-directory: Android
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.WIRELET_PAT }}
        run: ./gradlew :SheetMusicAudioAndroid:assembleRelease

      - name: Upload test reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: kotlin-test-reports
          path: |
            Android/SheetMusicAudioAndroid/build/reports/tests/

      - name: Upload AAR artifact
        uses: actions/upload-artifact@v4
        with:
          name: SheetMusicAudioAndroid-aar
          path: Android/SheetMusicAudioAndroid/build/outputs/aar/*.aar
          retention-days: 30
