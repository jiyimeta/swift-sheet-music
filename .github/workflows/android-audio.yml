name: Android audio module

# Android cross-compile + Kotlin test + AAR assembly. Runs on push to main
# and on demand. It is deliberately NOT triggered on pull_request: the job
# needs a GitHub Packages token (WIRELET_PAT) to download the wirelet
# Gradle plugin / runtime, and secrets are unavailable to fork PRs on a
# public repo — a fork PR would always fail here. Apple-side verification
# (which needs no secrets) covers pull requests via ci.yml, and
# Scripts/preflight.sh reproduces this Android pipeline locally.
on:
  push:
    branches: [main]
  workflow_dispatch:

# Building the Android audio module reproduces the full local-dev
# cross-compile pipeline, so this runs on macOS (Scripts/android-build-libs.sh
# hardcodes darwin NDK paths). The chain mirrors android-publish.yml:
#
#   1. Host Swift 6.3.3 (org.swift toolchain) + Android Swift SDK + NDK.
#   2. Scripts/android-build-libs.sh cross-compiles SheetMusicAndroidJNI for
#      each ABI and stages the swift-java JExtract Java bindings into
#      SheetMusicAndroid/src/main/java-generated. This also resolves the
#      SwiftPM deps (swift-wirelet via SSH, swift-java) into .build/checkouts.
#   3. swift-java's SwiftKitCore is published to mavenLocal (not on Central).
#   4. The wirelet Gradle plugin is fetched from GitHub Packages and runs
#      `swift run` against .build/checkouts/swift-wirelet to emit Kotlin codecs.
#
# swift-wirelet itself is a public repo, so its SwiftPM checkout resolves
# over public HTTPS with no auth. A classic PAT (read:packages) is still
# needed as WIRELET_PAT because GitHub Packages requires authentication to
# download the wirelet Gradle plugin / runtime even when they are public.
env:
  WIRELET_PAT: ${{ secrets.WIRELET_PAT }}

jobs:
  build-and-test:
    runs-on: macos-14
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4

      - name: Rewrite SSH GitHub URLs to authenticated HTTPS (belt-and-suspenders)
        run: |
          git config --global \
            url."https://x-access-token:${WIRELET_PAT}@github.com/".insteadOf \
            "git@github.com:"

      - name: Install Swift 6.3.3 toolchain
        run: |
          curl -fLO https://download.swift.org/swift-6.3.3-release/xcode/swift-6.3.3-RELEASE/swift-6.3.3-RELEASE-osx.pkg
          sudo installer -pkg swift-6.3.3-RELEASE-osx.pkg -target /
          # Prepend the open-source toolchain to PATH for all later steps.
          echo "/Library/Developer/Toolchains/swift-6.3.3-RELEASE.xctoolchain/usr/bin" >> "$GITHUB_PATH"
          swift --version

      - uses: android-actions/setup-android@v3

      - name: Install required NDK
        run: sdkmanager "ndk;27.3.13750724"

      - name: Install Swift Android SDK
        env:
          ANDROID_SDK_CHECKSUM: d160cc3206dd1886dae3fef2337af5e25ec034692cd0ec225721c56cc69da7f5
        run: |
          swift sdk install \
              https://download.swift.org/swift-6.3.3-release/android-sdk/swift-6.3.3-RELEASE/swift-6.3.3-RELEASE_android.artifactbundle.tar.gz \
              --checksum "$ANDROID_SDK_CHECKSUM"
          NDK_DIR="$ANDROID_HOME/ndk/27.3.13750724"
          ANDROID_NDK_HOME="$NDK_DIR" \
              ~/Library/org.swift.swiftpm/swift-sdks/swift-6.3.3-RELEASE_android.artifactbundle/swift-android/scripts/setup-android-sdk.sh

      - name: Cross-compile JNI natives + stage swift-java bindings
        run: Scripts/android-build-libs.sh

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v3

      - name: Publish swift-java SwiftKitCore to Maven local
        run: >-
          .build/checkouts/swift-java/gradlew
          -p .build/checkouts/swift-java
          :SwiftKitCore:publishToMavenLocal

      # All three modules, not just the audio one. :SheetMusicComposeAndroid is
      # DOWNSTREAM of :SheetMusicAudioAndroid, so naming only the latter left the
      # renderer — the module that decodes the draw program and paints it —
      # neither built nor tested on any push. Its `ScoreBandsTest` ran only at
      # release-tag time, in the publish workflow, which is not a gate.
      - name: Run Kotlin unit tests
        working-directory: Android
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.WIRELET_PAT }}
        run: >-
          ./gradlew
          :SheetMusicAndroid:testDebugUnitTest
          :SheetMusicAudioAndroid:testDebugUnitTest
          :SheetMusicComposeAndroid:testDebugUnitTest
          --info

      - name: Assemble release AARs
        working-directory: Android
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.WIRELET_PAT }}
        run: >-
          ./gradlew
          :SheetMusicAudioAndroid:assembleRelease
          :SheetMusicComposeAndroid:assembleRelease

      - name: Upload test reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: kotlin-test-reports
          path: |
            Android/SheetMusicAndroid/build/reports/tests/
            Android/SheetMusicAudioAndroid/build/reports/tests/
            Android/SheetMusicComposeAndroid/build/reports/tests/

      - name: Upload AAR artifact
        uses: actions/upload-artifact@v4
        with:
          name: SheetMusicAudioAndroid-aar
          path: Android/SheetMusicAudioAndroid/build/outputs/aar/*.aar
          retention-days: 30

      # Everything that can only be answered on a device.
      #
      # Three test classes have existed for a while and never run anywhere:
      # `FontMetricsBuilderTest` pins the runtime-measured font-metrics table —
      # the one thing that can engrave WRONG on Android without failing
      # anything, because nothing on the host exercises `Paint` — and
      # `EditSessionReplayTest` / `EditSessionReplayParityTest` replay the
      # host-recorded edit chains through a second, separately-linked image of
      # the engine, which is the claim the whole Android editing design rests
      # on. `docs/edit-commands.md` recorded the parity one as "the one
      # outstanding verification for this project".
      #
      # `:SheetMusicComposeAndroid` joins them with `ScoreCanvasGoldenTest`,
      # which engraves a score and compares the painted bitmap against a
      # committed PNG. That is the only thing anywhere that looks at what the
      # Android renderer actually draws: the Swift tests assert on the draw
      # *program*, the Kotlin unit tests on band arithmetic, and neither can see
      # a glyph that stopped drawing or a paint state that leaked.
      #
      # In THIS job rather than a Linux one with KVM, despite the acceleration
      # Linux would bring: the wirelet Gradle plugin shells out to `swift run`,
      # so any job that compiles Kotlin needs the Swift toolchain and the
      # resolved SwiftPM checkout that only this job has. Splitting would mean
      # installing Swift on Linux and resolving the package a second time to
      # save emulator minutes on a job that already paid for the cross-compile.
      #
      # `arch: arm64-v8a` because the macOS runners are Apple silicon and the
      # emulator is only usable there with a matching image (HVF); an x86_64
      # image would fall back to full emulation and time out.
      - name: Run instrumented tests
        uses: reactivecircus/android-emulator-runner@v2
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.WIRELET_PAT }}
        with:
          api-level: 35
          arch: arm64-v8a
          target: google_apis
          disable-animations: true
          script: >-
            ./Android/gradlew -p Android
            :SheetMusicAndroid:connectedDebugAndroidTest
            :SheetMusicComposeAndroid:connectedDebugAndroidTest

      - name: Upload instrumented test reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: instrumented-test-reports
          path: |
            Android/SheetMusicAndroid/build/reports/androidTests/
            Android/SheetMusicComposeAndroid/build/reports/androidTests/
