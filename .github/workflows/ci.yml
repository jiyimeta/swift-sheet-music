name: CI

# Apple-side build + test gate. Runs on every push and pull request,
# including fork PRs — the SwiftPM dependency graph (swift-java,
# swift-subprocess, swift-wirelet) resolves over public HTTPS and needs
# no secrets. The Android cross-compile lives in android-audio.yml, which
# needs a GitHub Packages token and therefore only runs on push to main.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apple:
    name: Build & test (Apple)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      # The Apple graph includes the opt-in SheetMusicAudioFluidSynth product,
      # which links Homebrew libfluidsynth (LGPL-2.1) via the CFluidSynth
      # systemLibrary. `swift build`/`swift test` therefore need fluid-synth on
      # PATH and its pkg-config `.pc` files discoverable (they land under the
      # Homebrew prefix, which the default pkg-config search path may miss).
      - name: Install FluidSynth
        run: brew install fluid-synth

      - name: Export PKG_CONFIG_PATH
        run: echo "PKG_CONFIG_PATH=$(brew --prefix)/lib/pkgconfig" >> "$GITHUB_ENV"

      - name: Swift version
        run: swift --version

      - name: Build
        run: swift build

      - name: Test
        run: swift test
