name: Publish Android modules to GitHub Packages

on:
  push:
    tags:
      # Both spellings: releases up to 1.2.2 were tagged `v1.2.2`, and
      # from 1.2.3 onward the prefix was dropped. Matching only 'v*' meant
      # eight releases (1.2.3 through 1.5.1) never published an AAR.
      - 'v[0-9]+.[0-9]+.[0-9]+'
      - '[0-9]+.[0-9]+.[0-9]+'
  workflow_dispatch:
    inputs:
      version:
        description: 'Override version (defaults to the tag, minus any leading v)'
        required: false

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: macos-14
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Resolve version
        id: ver
        env:
          INPUT_VERSION: ${{ inputs.version }}
          REF_NAME: ${{ github.ref_name }}
          REF_TYPE: ${{ github.ref_type }}
        run: |
          if [[ -n "$INPUT_VERSION" ]]; then
            version="$INPUT_VERSION"
          elif [[ "$REF_TYPE" == "tag" ]]; then
            version="${REF_NAME#v}"
          else
            echo "::error::No tag ref and no inputs.version provided." \
                 "Run this workflow only on a release tag or via workflow_dispatch with an explicit version." >&2
            exit 1
          fi
          # Reject anything that doesn't look like a Maven/Semver version.
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[A-Za-z0-9.-]+)?$ ]]; then
            echo "::error::Refusing to publish version '$version' —" \
                 "must look like 1.2.3 or 1.2.3-suffix." >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Install Swift 6.3.3 toolchain
        run: |
          curl -fLO https://download.swift.org/swift-6.3.3-release/xcode/swift-6.3.3-RELEASE/swift-6.3.3-RELEASE-osx.pkg
          sudo installer -pkg swift-6.3.3-RELEASE-osx.pkg -target /
          # Prepend the open-source toolchain to PATH for all later steps so
          # plain `swift` resolves to it (it is paired with the 6.3.3 Android
          # SDK; Apple's Xcode swiftc produces incompatible swiftmodules).
          echo "/Library/Developer/Toolchains/swift-6.3.3-RELEASE.xctoolchain/usr/bin" >> "$GITHUB_PATH"

      - uses: android-actions/setup-android@v3

      - name: Install required NDK
        run: sdkmanager "ndk;27.3.13750724"

      - name: Install Swift Android SDK
        env:
          # Re-derive the checksum from https://www.swift.org/install/macos/
          # (or the Swift SDK for Android getting-started guide) if upstream
          # rotates the artifact. Value below is the swift-6.3.3-RELEASE SDK.
          ANDROID_SDK_CHECKSUM: d160cc3206dd1886dae3fef2337af5e25ec034692cd0ec225721c56cc69da7f5
        run: |
          swift sdk install \
              https://download.swift.org/swift-6.3.3-release/android-sdk/swift-6.3.3-RELEASE/swift-6.3.3-RELEASE_android.artifactbundle.tar.gz \
              --checksum "$ANDROID_SDK_CHECKSUM"
          # Run the SDK's NDK sysroot setup (one-time)
          NDK_DIR="$ANDROID_HOME/ndk/27.3.13750724"
          ANDROID_NDK_HOME="$NDK_DIR" \
              ~/Library/org.swift.swiftpm/swift-sdks/swift-6.3.3-RELEASE_android.artifactbundle/swift-android/scripts/setup-android-sdk.sh

      - name: Cross-compile JNI natives
        run: Scripts/android-build-libs.sh

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v3

      # swift-java's SwiftKitCore is not on Maven Central; the Android
      # modules resolve it from Maven local. The runner starts with an empty
      # ~/.m2, so publish it from the SwiftPM checkout before the Gradle build
      # (mirrors android-audio.yml).
      - name: Publish swift-java SwiftKitCore to Maven local
        run: >-
          .build/checkouts/swift-java/gradlew
          -p .build/checkouts/swift-java
          :SwiftKitCore:publishToMavenLocal

      - name: Publish to GitHub Packages
        working-directory: Android
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ORG_GRADLE_PROJECT_version: ${{ steps.ver.outputs.version }}
        run: |
          ./gradlew \
              -Pversion="${ORG_GRADLE_PROJECT_version}" \
              :SheetMusicAndroid:publishReleasePublicationToGithubPackagesRepository \
              :SheetMusicAudioAndroid:publishReleasePublicationToGithubPackagesRepository
